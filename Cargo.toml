[package]
# `contour` is taken on crates.io. The binary, the lib and the tool are all
# still `contour` — only the package someone types `cargo install` at differs.
name = "contour-index"
version = "0.2.0"
edition = "2024"
description = "A multi-resolution semantic index of source code: search, navigation, and duplicate detection over intent rather than syntax."
license = "MIT"
repository = "https://github.com/dpep/contour"
keywords = ["ruby", "code-search", "semantic", "duplicate-detection", "prism"]
categories = ["development-tools", "command-line-utilities"]

# Named explicitly so the crates.io package name stays confined to this file:
# the binary on PATH and `use contour::` in the source are both unaffected.
[lib]
name = "contour"
path = "src/lib.rs"

[[bin]]
name = "contour"
path = "src/main.rs"

# Allow-by-default upstream. `pub` on an item inside a private module is
# reachable from nowhere, yet `pub` is exactly what makes the dead_code lint
# skip an item — so it costs API surface and buys blindness.
[lints.rust]
unreachable_pub = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rayon = "1"
# Pinned to the minor the vendored tables were generated against: rwr's
# `generated.rs` enumerates every Prism node, and a new one added upstream
# would be silently skipped rather than fail to compile.
ruby-prism = "1.9"
rusqlite = { version = "0.40", features = ["bundled"] }
# Rust extraction (DEC-012). tree-sitter rather than `syn`: the degraded tier
# needs a token stream and a shallow item walk, not a faithful AST, and rq
# already proves this shape across five languages.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
# The Anthropic Messages API over raw HTTP: Rust has no official SDK. Same
# version gqls uses, so the house has one HTTP client rather than two.
ureq = { version = "2", features = ["json"] }

# Semantic embeddings (opt-in via the `semantic` feature): local
# all-MiniLM-L6-v2 through ONNX Runtime, vendored from gqls with the same pins
# so the copied onnx.rs matches the ort API. Off by default, unlike gqls: the
# hash embedder exercises the whole pipeline, and a build that downloads a
# runtime is a poor default for a tool nobody has installed yet.
ort = { version = "=2.0.0-rc.12", default-features = false, optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
log = { version = "0.4", optional = true }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[features]
default = []

# Internal: the embedding code and its deps, minus the ORT linking strategy.
# Not selected directly — pick one of the two below.
_semantic = [
  "dep:ort", "dep:tokenizers", "dep:hf-hub", "dep:log",
  "ort/std", "ort/ndarray", "ort/tracing", "ort/api-24",
]
# ONNX Runtime downloaded and statically linked at build time.
semantic = ["_semantic", "ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]
# ONNX Runtime dlopen'd from a system install at runtime: smaller binary, no
# build-time download. This is the one `script/check.sh` compiles, because it
# proves the code path builds without fetching a runtime in CI.
semantic-dynamic = ["_semantic", "ort/load-dynamic"]

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
