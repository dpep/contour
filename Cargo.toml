[package]
name = "contour"
version = "0.1.0"
edition = "2024"
description = "A multi-resolution semantic index of source code: search, navigation, and duplicate detection over intent rather than syntax."
license = "MIT"
repository = "https://github.com/dpep/contour"
keywords = ["ruby", "code-search", "semantic", "duplicate-detection", "prism"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "contour"
path = "src/main.rs"

# Allow-by-default upstream. `pub` on an item inside a private module is
# reachable from nowhere, yet `pub` is exactly what makes the dead_code lint
# skip an item — so it costs API surface and buys blindness.
[lints.rust]
unreachable_pub = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rayon = "1"
# Pinned to the minor the vendored tables were generated against: rwr's
# `generated.rs` enumerates every Prism node, and a new one added upstream
# would be silently skipped rather than fail to compile.
ruby-prism = "1.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
